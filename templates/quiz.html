{% extends "base.html" %}{% block title %}Quiz — MoneyWise{% endblock %}{% block heading %}Interactive money literacy quiz{% endblock %}
{% block content %}<form method="post" action="{{url_for('quiz_submit')}}"><div class="quiz-list">{% for q in questions %}<div class="card question"><span class="eyebrow">QUESTION {{loop.index}}</span><h2>{{q.q}}</h2>{% for o in q.options %}<label class="option"><input type="radio" name="{{q.id}}" value="{{o}}" required><span>{{o}}</span></label>{% endfor %}</div>{% endfor %}</div><button class="btn primary" type="submit">Check my score</button></form>{% endblock %}
